<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Group Goals Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <h2 class="mb-4 text-center">🧠 Notion-Style Group Goals Tracker</h2>

    <form action="/add" method="post" class="row g-2 mb-4">
        <div class="col-md-5">
            <input name="description" class="form-control" placeholder="Goal description" required>
        </div>
        <div class="col-md-3">
            <input name="collaborator" class="form-control" placeholder="Collaborator">
        </div>
        <div class="col-md-2">
            <select name="status" class="form-select">
                <option>To Do</option>
                <option>In Progress</option>
                <option>Done</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100">Add Goal</button>
        </div>
    </form>

    <ul class="list-group">
        {% for goal in goals %}
        <li class="list-group-item d-flex justify-content-between align-items-center {% if goal.done %}list-group-item-success{% endif %}">
            <div>
                <strong>{{ goal.description }}</strong>
                <small class="text-muted">• {{ goal.collaborator or 'No collaborator' }} • {{ goal.status }}</small>
            </div>
            <div>
                <a href="/toggle/{{ goal.id }}" class="btn btn-outline-success btn-sm">✓</a>
                <a href="/delete/{{ goal.id }}" class="btn btn-outline-danger btn-sm">🗑</a>
            </div>
        </li>
        {% endfor %}
    </ul>
</div>
</body>
</html>
